# Created: 2026-10-15
name: Build and deploy Remotion Style Atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm install --frozen-lockfile
      - name: Install the independent technology graph outside the parent workspace
        run: |
          runtime_dir="$RUNNER_TEMP/atlas-technology-runtime"
          mkdir -p "$runtime_dir"
          cp technology-runtime/package.json technology-runtime/pnpm-lock.yaml technology-runtime/pnpm-workspace.yaml "$runtime_dir/"
          (cd "$runtime_dir" && pnpm install --frozen-lockfile)
          ln -s "$runtime_dir/node_modules" technology-runtime/node_modules
          test -f technology-runtime/node_modules/cesium/package.json
      - run: pnpm test
      - run: pnpm run build
        env:
          ATLAS_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy reviewed catalog
        id: deployment
        uses: actions/deploy-pages@v4
